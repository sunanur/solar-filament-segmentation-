[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filament-seg"
version = "0.1.0"
description = "Full-disk H-alpha solar filament instance segmentation (MAGFiLO 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "scikit-learn>=1.3",
]

[tool.setuptools]
packages = ["filament_seg"]
